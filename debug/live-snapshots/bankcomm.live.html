function getCurrentTime () {

	}
}
function  parseISO8601(parms) {
	var isoExp= /^\s*(\d{4})-(\d\d)-(\d\d)\s*$/
	var date =new Date(NaN);
	var month
	var isoDate =isoExp.exec(parms)
	if (isoDate) {
		month=+isoDate[2]
		date.setFullYear(isoDate[1],month-1,isoDate[3])
		if(month!=date.getMonth()+1){
			date.setTime(NaN)
		}
	}
	return date
  }
//获取近三个月的时间段所有日期
function getThrMonth() {
	var end = new Date()
	var year = end.getFullYear()
	var month = end.getMonth()+1
	var day = end.getDate()
	var dateObj={}
	if(parseInt(month)<10){
		month = "0"+month
	}
	if(parseInt(day)<10){
		day = "0"+day
	}
	dateObj.now =year+"-"+month+"-"+day
	if(parseInt(month)==1){
		dateObj.last = parseInt(year)-1+'-10-'+day
		return dateObj
	}
		if(parseInt(month)==2){
		dateObj.last = parseInt(year)-1+'-11-'+day
		return dateObj
	}
		if(parseInt(month)==3){
		dateObj.last = parseInt(year)-1+'-12-'+day
		return dateObj
	}
	var preSize = new Date(year,parseInt(month)-3,0).getDate()
	if (preSize<parseInt(day)) {
		var resultMonth = parseInt(month)-2<10?'0'+parseInt(month)-2:parseInt(month)-2
		dateObj.last =year+"-0"+resultMonth+"-01"
		return dateObj
	}
	if (parseInt(month)<=10) {
		dateObj.last = year+"-0"+( parseInt(month)-3)+'-'+day
		return dateObj
	}else{
			dateObj.last = year+"-0"+( parseInt(month)-3)+'-'+day
				return dateObj
	}
}
function getDayAll(starDay,endDay) {
	var arr=[]
	var dates = []
	var db = parseISO8601(starDay)
	var de = parseISO8601(endDay)
	var s = db.getTime()-24*60*60*1000
	var d = de.getTime()
	for(var i=s;i<d;i++){
		i= i+24*60*60*1000
		arr.push(parseInt(i))
	}
	for(var j=0;j<arr.length;j++){
		var time = new Date(arr[j])
		var year = time.getFullYear(time)
		var mouth = time.getMonth()+1>=10?time.getMonth()+1:'0'+(time.getMonth()+1)
		var day = time.getDate()>=10?time.getDate():'0'+time.getDate()
		var YYMMDD = year+'-'+mouth+"-"+day
		dates.push(YYMMDD)
	}
	dates.shift()
	return dates
}
